name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Catalogue and transport
        run: /usr/bin/python3 -m unittest discover -s tests -v
      - name: Install native runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gi gir1.2-gtk-4.0 gir1.2-adw-1 gir1.2-webkit-6.0 xvfb dbus-x11
      - name: GTK and WebKit playback
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          GSK_RENDERER: cairo
          WEBKIT_DISABLE_DMABUF_RENDERER: '1'
        run: dbus-run-session -- xvfb-run -a ./dev.sh --smoke-test
